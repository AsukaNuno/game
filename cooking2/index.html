<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>りょうりシミュレーター</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>
<style>
  body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
       background:#FFF8F0;color:#3A2800;max-width:400px;margin:0 auto;
       padding:16px;text-align:center;}
  h1{font-size:22px;color:#D4891A;margin:16px 0 12px;}
  .sub{font-size:13px;color:#8A6840;}
  #foods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0;}
  .food{font-family:inherit;font-size:15px;background:#F0E0C0;border:none;
        border-radius:8px;padding:8px 12px;cursor:pointer;}
  .food:active{transform:translateY(2px);}
  hr{border:none;border-top:1px dashed #C8B090;margin:20px 0 8px;}
  #pot{font-size:18px;min-height:28px;margin-bottom:8px;}
  #cook{font-family:inherit;font-size:17px;font-weight:bold;color:#fff;
        background:#E07020;border:none;border-radius:10px;
        padding:12px 28px;cursor:pointer;margin:16px 0;}
  #result{font-size:16px;color:#D4891A;min-height:52px;white-space:pre-line;}
  #reset{font-family:inherit;font-size:13px;color:#8A6840;background:#F0E0C0;
         border:none;border-radius:8px;padding:6px 16px;cursor:pointer;}
  #status{font-size:12px;color:#B09070;margin-top:16px;}
</style>
</head>
<body>
<h1>🍳 りょうりシミュレーター</h1>
<p class="sub">食材をえらぼう（3つまで）</p>
<div id="foods">
  <button class="food" data-i="0">🍎 りんご</button>
  <button class="food" data-i="1">🥩 肉</button>
  <button class="food" data-i="2">🐟 さかな</button>
  <button class="food" data-i="3">🍄 きのこ</button>
  <button class="food" data-i="4">🍯 はちみつ</button>
</div>
<hr>
<p class="sub">なべの中</p>
<div id="pot">（まだ何も入っていない）</div>
<button id="cook">🔥 りょうりする！</button>
<div id="result"></div>
<button id="reset">もう一回</button>
<p id="status">Python 読み込み中...</p>

<script type="py">
from pyscript import document
from pyodide.ffi import create_proxy

FOODS = ["🍎 りんご", "🥩 肉", "🐟 さかな", "🍄 きのこ", "🍯 はちみつ"]

def get_recipe(pot):
    if "🥩 肉" in pot and "🍄 きのこ" in pot:
        return "🍖 肉ときのこのソテー ❤❤❤❤❤"
    if pot.count("🥩 肉") >= 2:
        return "🥩 ステーキ ❤❤❤❤"
    if "🐟 さかな" in pot:
        return "🐟 さかなのソテー ❤❤❤"
    if "🍎 りんご" in pot and "🍯 はちみつ" in pot:
        return "🍰 りんごケーキ ❤❤❤"
    if pot.count("🍎 りんご") >= 2:
        return "🍓 フルーツもり ❤❤"
    return "🍲 なんかのごはん ❤"

MAX = 3
pot = []

def add_food(food):
    if len(pot) >= MAX:
        return False
    pot.append(food)
    return True

pot_el = document.getElementById("pot")
result_el = document.getElementById("result")

def on_add(event):
    i = int(event.currentTarget.getAttribute("data-i"))
    if add_food(FOODS[i]):
        pot_el.innerText = "  ".join(pot)
    else:
        pot_el.innerText = "いっぱい！りょうりしよう🍳"

def on_cook(event):
    if not pot:
        result_el.innerText = "食材をえらんでね！"
        return
    result_el.innerText = "できた！\n" + get_recipe(pot)

def on_reset(event):
    pot.clear()
    pot_el.innerText = "（まだ何も入っていない）"
    result_el.innerText = ""

for btn in document.querySelectorAll(".food"):
    btn.addEventListener("click", create_proxy(on_add))

document.getElementById("cook").addEventListener("click", create_proxy(on_cook))
document.getElementById("reset").addEventListener("click", create_proxy(on_reset))

document.getElementById("status").innerText = "準備OK"
</script>
</body>
</html>
